
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take's Phone 🍀</title>
<style>
body {
  margin: 0;
  background: #e3eddf;
  color: #35523b;
  font-family: sans-serif;
}
.phone {
  max-width: 400px;
  min-height: 100vh;
  margin: auto;
  background: #faf9f1;
  text-align: center;
  padding: 25px 18px;
  box-sizing: border-box;
}
.clover { font-size: 75px; margin-top: 55px; }
h1 { font-size: 25px; }
p { color: #6b806d; }
.apps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 35px;
}
button {
  padding: 18px 5px;
  border: 0;
  border-radius: 18px;
  background: #e3eddf;
  color: #35523b;
  font-size: 15px;
}
</style>
</head>
<body>
<div class="phone">
  <div class="clover">🍀</div>
  <h1>하나가키 타케미치</h1>
  <p>너의 작은 클로버 💚</p>
  <div class="apps">
    <button onclick="alert('타케미치에게 메시지를 보내 보자!')">💌<br>문자</button>
    <button onclick="alert('가상 전화 화면 준비 중!')">☎️<br>전화</button>
    <button onclick="alert('클로버 사진첩 준비 중!')">🖼️<br>사진첩</button>
    <button onclick="alert('대화 목록 준비 중!')">💬<br>대화 목록</button>
    <button onclick="alert('AI 대화 기능은 다음 단계에서 연결할게!')">🍀<br>AI 대화</button>
    <button onclick="alert('타케미치의 프로필 💚')">👤<br>프로필</button>
  </div>
</div>
</body>
</html>
